name: Publish to PyPI

# Trusted publishing — no API tokens required.
# Setup (one-time, on PyPI):
#   1. Go to https://pypi.org/manage/account/publishing/
#   2. Add a Pending Publisher for project `sol-agent-wallet`:
#        Owner: yksanjo
#        Repository: sol-agent-wallet
#        Workflow: publish.yml
#        Environment: pypi
#   3. Push a `v*` tag to trigger this workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sol-agent-wallet
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
